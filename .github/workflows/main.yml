name: Main

on:
  pull_request:
  push:
    branches:
      - main
      - version/**

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci-setup

      - name: Lint
        run: |
          yarn lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci-setup

      - name: Lint
        run: |
          yarn format

  check_types:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci-setup

      - name: Check types
        run: |
          yarn check-types

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/ci-setup

      - name: Build
        run: |
          yarn build

  ci-ok:
    name: CI ok
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, format, check_types]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
